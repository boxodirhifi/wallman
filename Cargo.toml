[package]
name = "wallman"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2.189"
image = "0.25"
